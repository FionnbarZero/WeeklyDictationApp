<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#314a91" />
    <title>Grade 5 Learning Hub Lab</title>
    <link rel="stylesheet" href="/src/grade5Lab/learningHub.css" />
  </head>
  <body>
    <main class="lab-shell">
      <header class="lab-banner">
        <div>
          <p class="eyebrow">Development-only child experience</p>
          <h1>Grade 5 Learning Hub</h1>
          <p>Choose this week’s homework, prepare for either test, or review older vocabulary.</p>
        </div>
        <div class="lab-mark" aria-hidden="true">五</div>
      </header>

      <p class="lab-notice">Test lab: books can open, but learning engines, scores, progress, and cloud services are not connected.</p>
      <p id="hub-status" class="status" role="status" aria-live="polite"></p>
      <div id="hub-sections" class="hub-sections"></div>

      <aside id="request-panel" class="request-panel" hidden aria-live="polite">
        <h2 id="request-title">Activity request</h2>
        <p id="request-message"></p>
        <pre id="request-output"></pre>
        <button id="dismiss-request" class="dismiss-button" type="button">Close Preview</button>
      </aside>
    </main>
    <script type="module" src="/src/grade5LearningHubHarness.ts"></script>
  </body>
</html>
