name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-quality:
    name: Typecheck, lint, format, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:production
      - run: npm run audit:tooling
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:release-tools
      - run: npm run check:retention-tools
      - run: npm run check:security-tools
      - run: npm test

  builds:
    name: Production and reference builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:check
      - run: npm run build:public-preview
      - run: npm run build:prototype-baseline
      - run: npm run package:family-beta -- --grade kindergarten
      - run: npm run package:family-beta -- --grade grade2 --curriculum-snapshot public/curriculum/grade2-presentation.json
      - run: npm run package:family-beta -- --grade grade5

  browser:
    name: Browser behavior and visual parity
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run package:family-beta -- --grade kindergarten
      - run: npm run package:family-beta -- --grade grade2 --curriculum-snapshot public/curriculum/grade2-presentation.json
      - run: npm run package:family-beta -- --grade grade5
      - run: npm run test:family-beta-artifacts
      - run: npm run test:browser
      - run: npm run test:public-preview
      - run: npm run test:prototype-baseline
      - name: Version 7 writing refinement in its own build mode
        run: |
          npx vite build --mode writing-refinement-preview
          npx playwright test --config playwright.writing-refinement.config.ts
      - name: Version 8 iPad writing and gesture-gated audio
        run: |
          npx vite build --mode writing-ipad-preview
          npx playwright test --config playwright.writing-ipad.config.ts
      - name: Approved cross-grade writing prototype
        run: |
          npx vite build --config vite.cross-grade-writing.config.ts
          npx playwright test --config playwright.cross-grade-writing.config.ts
      - name: Preserve failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            writing-refinement-test-results/
            writing-ipad-test-results/
            cross-grade-writing-test-results/
          retention-days: 7

  firestore-emulator:
    name: Firestore Emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:firestore

  family-sync:
    name: Canonical family package and production family rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # No predecessor selector is enabled here; each test owns its browser and
      # synthetic backend. Keep rendering-sensitive cases serial: simultaneous
      # software-rendered games can exhaust their unchanged timing assertions.
      - name: Serial animation and report-pause cases
        run: npx playwright test --config playwright.family-sync.config.ts --workers=1 --grep 'Context (confirmation|stage|restores|keeps|Gap Dash)|Shadow Strike report pause holds' --output test-results/family-sync-timing
      - name: Independent family saving and continuity cases
        run: npx playwright test --config playwright.family-sync.config.ts --workers=3 --grep-invert 'Context (confirmation|stage|restores|keeps|Gap Dash)|Shadow Strike report pause holds'
      - name: Current enabled writing package and saving safeguards
        run: npx playwright test --config playwright.current-writing.config.ts
      - name: Test the deployed family policy with synthetic emulator records
        env:
          FAMILY_SYNC_RULES_FILE: deployment/firestore-family-sync.rules
        run: npx firebase emulators:exec --only firestore --project weekly-dictation-test "node --experimental-strip-types --test --test-name-pattern='^family ' tests/firestoreEmulator.emulator.ts"
      - name: Check family reliability formatting and lint
        run: npx biome check src/activity src/auth/tokenRefresh.ts src/firebaseClient.ts src/familyBeta/cloud.ts src/familyBeta/resultHistory.ts src/familyBeta/ResultHistory.tsx src/familyBeta/deviceSync.ts src/familyBeta/workspaceOwner.ts src/familyBeta/useWorkspaceState.ts src/familyBeta/context.ts src/familyBeta/activitySlots.ts src/familyBeta/gameFrame.tsx tests/resultHistoryPaging.test.ts tests/authTokenRefresh.test.ts tests/deviceSyncDownloadGuard.test.ts tests/sharedWorkspace.test.ts tests/activityClock.test.ts tests/scopedActivityStorage.test.ts tests/familyActivityContext.test.ts scripts/serve-family-sync-test.ts playwright.family-sync.config.ts tests/family-sync
      - name: Check offline startup and packaging boundaries
        run: npx biome check src/familyBeta/offlineFamily.ts scripts/familyOfflineShell.ts scripts/package-family-sync.ts scripts/package-family-sync-alias.ts tests/offlineFamily.test.ts tests/familyOfflineShell.test.ts
      - name: Preserve failed family browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: family-browser-failure-evidence
          path: |
            test-results/family-sync/
            test-results/family-sync-timing/
            test-results/current-writing/
          retention-days: 7
