name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-quality:
    name: Typecheck, lint, format, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:production
      - run: npm run audit:tooling
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  builds:
    name: Production and reference builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:check
      - run: npm run build:public-preview
      - run: npm run build:prototype-baseline
      - run: npm run package:family-beta -- --grade kindergarten
      - run: npm run package:family-beta -- --grade grade2 --curriculum-snapshot public/curriculum/grade2-presentation.json
      - run: npm run package:family-beta -- --grade grade5

  browser:
    name: Browser behavior and visual parity
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run package:family-beta -- --grade kindergarten
      - run: npm run package:family-beta -- --grade grade2 --curriculum-snapshot public/curriculum/grade2-presentation.json
      - run: npm run package:family-beta -- --grade grade5
      - run: npm run test:family-beta-artifacts
      - run: npm run test:browser
      - run: npm run test:public-preview
      - run: npm run test:prototype-baseline

  firestore-emulator:
    name: Firestore Emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:firestore

  family-sync:
    name: Canonical family package and production family rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.family-sync.config.ts
      - name: Test the deployed family policy with synthetic emulator records
        env:
          FAMILY_SYNC_RULES_FILE: deployment/firestore-family-sync.rules
        run: npx firebase emulators:exec --only firestore --project weekly-dictation-test "node --experimental-strip-types --test --test-name-pattern='^family ' tests/firestoreEmulator.emulator.ts"
      - name: Check family reliability formatting and lint
        run: npx biome check src/activity src/auth/tokenRefresh.ts src/firebaseClient.ts src/familyBeta/cloud.ts src/familyBeta/resultHistory.ts src/familyBeta/ResultHistory.tsx src/familyBeta/deviceSync.ts src/familyBeta/workspaceOwner.ts src/familyBeta/useWorkspaceState.ts src/familyBeta/context.ts src/familyBeta/activitySlots.ts src/familyBeta/gameFrame.tsx tests/resultHistoryPaging.test.ts tests/authTokenRefresh.test.ts tests/deviceSyncDownloadGuard.test.ts tests/sharedWorkspace.test.ts tests/activityClock.test.ts tests/scopedActivityStorage.test.ts tests/familyActivityContext.test.ts scripts/serve-family-sync-test.ts playwright.family-sync.config.ts tests/family-sync
      - name: Check offline startup and packaging boundaries
        run: npx biome check src/familyBeta/offlineFamily.ts scripts/familyOfflineShell.ts scripts/package-family-sync.ts scripts/package-family-sync-alias.ts tests/offlineFamily.test.ts tests/familyOfflineShell.test.ts
