<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-labelledby="title desc">
  <title id="title">Stroke-order Slay touch-writing practice</title>
  <desc id="desc">A glowing Mandarin character tracing board with an animated brush path, practice cards, and ninja stars.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#111936" />
      <stop offset="1" stop-color="#080c1c" />
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#202a55" />
      <stop offset="1" stop-color="#131936" />
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#45e6b7" stop-opacity=".42" />
      <stop offset="1" stop-color="#45e6b7" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#02040d" flood-opacity=".65" />
    </filter>
    <filter id="mintGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0v46" fill="none" stroke="#8fa0e8" stroke-opacity=".07" stroke-width="2" />
    </pattern>
  </defs>

  <rect width="800" height="580" fill="url(#bg)" />
  <rect width="800" height="580" fill="url(#grid)" />
  <circle cx="150" cy="120" r="230" fill="#ff4976" opacity=".1" />
  <circle cx="670" cy="490" r="250" fill="#45e6b7" opacity=".08" />
  <circle cx="400" cy="285" r="245" fill="url(#glow)" />

  <g fill="none" stroke="#7b8bd6" stroke-linecap="round" stroke-width="5" opacity=".35">
    <path d="M80 160c28-25 57-25 86 0" />
    <path d="M644 118c22 0 22-26 44-26s22 26 44 26" />
    <path d="M68 454h92M640 462h98" stroke-dasharray="8 13" />
  </g>

  <g filter="url(#shadow)">
    <rect x="225" y="70" width="350" height="438" rx="38" fill="url(#panel)" stroke="#53629d" stroke-width="7" />
    <rect x="254" y="112" width="292" height="292" rx="26" fill="#0b1025" stroke="#45e6b7" stroke-opacity=".7" stroke-width="5" />
    <path d="M400 112v292M254 258h292M277 135l246 246M523 135 277 381" stroke="#526085" stroke-dasharray="9 12" stroke-width="3" opacity=".6" />
    <path d="M375 159c4 55-8 107-34 155-14 26-37 47-67 62M376 240c26 26 51 59 73 98 13 23 35 40 68 51" fill="none" stroke="#45e6b7" stroke-linecap="round" stroke-width="18" opacity=".22" filter="url(#mintGlow)" />
    <path d="M375 159c4 55-8 107-34 155-14 26-37 47-67 62M376 240c26 26 51 59 73 98 13 23 35 40 68 51" fill="none" stroke="#70f4ce" stroke-linecap="round" stroke-width="10" />
    <circle cx="375" cy="159" r="12" fill="#ffcf5a" stroke="#080c1c" stroke-width="5" />
    <path d="m512 389 19 7-14 14z" fill="#ffcf5a" stroke="#080c1c" stroke-linejoin="round" stroke-width="4" />
    <rect x="274" y="432" width="252" height="42" rx="21" fill="#2c3767" />
    <rect x="274" y="432" width="178" height="42" rx="21" fill="#ffcf5a" />
    <circle cx="454" cy="453" r="17" fill="#fff7dd" stroke="#080c1c" stroke-width="5" />
  </g>

  <g filter="url(#shadow)" font-family="Songti SC, STSong, serif" font-size="58" font-weight="700" text-anchor="middle">
    <g transform="rotate(-10 147 288)">
      <rect x="90" y="222" width="114" height="132" rx="16" fill="#fff8e7" stroke="#080c1c" stroke-width="7" />
      <text x="147" y="309" fill="#ff4976">一</text>
      <path d="M112 329h70" stroke="#ffcf5a" stroke-linecap="round" stroke-width="7" />
    </g>
    <g transform="rotate(9 654 310)">
      <rect x="597" y="244" width="114" height="132" rx="16" fill="#fff8e7" stroke="#080c1c" stroke-width="7" />
      <text x="654" y="331" fill="#2b8e76">人</text>
      <path d="M619 351h70" stroke="#45e6b7" stroke-linecap="round" stroke-width="7" />
    </g>
  </g>

  <g fill="#8fa0e8" stroke="#080c1c" stroke-linejoin="round" stroke-width="5">
    <path d="m127 103 12 26 28-4-17 23 18 21-28-3-10 26-10-26-28 4 17-23-18-21 28 3z" />
    <path d="m674 439 10 21 23-3-14 19 15 17-23-2-9 21-8-21-23 3 14-19-15-17 23 2z" />
  </g>
  <g fill="#ffcf5a">
    <circle cx="184" cy="460" r="7" />
    <circle cx="627" cy="92" r="7" />
    <path d="m95 354 6 14 15 6-15 6-6 14-6-14-14-6 14-6z" />
    <path d="m707 213 6 14 15 6-15 6-6 14-6-14-14-6 14-6z" />
  </g>
</svg>
